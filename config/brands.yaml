# Study brand set. Retrieved and verified 2026-10-01 (IST) unless stated.
# brand_type is assigned by ORIGIN (how the brand was built), not current ownership.
#   d2c_origin = Indian brand built online-first (own site + marketplaces), launched 2013 or later
#   incumbent  = brand established in the category before the Indian D2C wave, multi-channel, mass-media built
# Ownership changes are recorded in ownership_note and analysed as a sensitivity check.
#
# aliases: matched case-insensitively with word boundaries unless listed under aliases_case_sensitive.
# ambiguous: true means a plain-word reading exists (e.g. "noise cancellation", "Kakadu plum",
#   "minimalist routine"); every hit is cross-checked against the LLM coder's brand list and
#   disagreements go to data/manual/ambiguity_review.csv for a human decision.
# positioning_codes: attribute codes (see config/attribute_codes.csv) that the brand's OWN official
#   wording claims. Derived only from the quoted text below. To be checked by a second author.

retrieved: "2026-10-01"

